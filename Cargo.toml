[package]
name = "osmnexus"
version = "0.1.0"
edition = "2021"

[dependencies]
osmpbf = "0.3"
rayon = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
geo = "0.29"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
bytes = "1"
futures = "0.3"
rustc-hash = "2"
csv = "1"
dhat = { version = "0.3.3", optional = true }
memmap2 = "0.9"
tempfile = "3"
boomphf = "0.6"
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }
parquet = { version = "53", features = ["arrow"], optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Fast iteration profile: `cargo build --profile dev-fast`. Skips LTO/high codegen-units
# entirely and drops debug info, so it's much closer to `cargo check` speed than to
# `--release`, while still producing a runnable binary (unlike `cargo check`).
[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = false
incremental = true

[features]
# GeoParquet output backend. Default-on, so plain builds behave as before;
# `--no-default-features` skips the heavy arrow/parquet dependency tree
# (useful for minimal or wasm builds).
default = ["parquet"]
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
dhat = ["dep:dhat"]

[[bench]]
name = "topic_pipeline"
harness = false
