[package]
name = "osmnexus-codegen"
version = "0.1.0"
edition = "2021"
description = "Code and graph generation from compiled osmnexus topics: TypeScript types, Graphviz DOT, editor tree graphs."

[dependencies]
osmnexus-lang = { path = "../osmnexus-lang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
