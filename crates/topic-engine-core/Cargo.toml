[package]
name = "topic-engine-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = "0.29"
anyhow = "1"
thiserror = "2"
rustc-hash = "2"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tracing = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]
